name: MMB - Release Packages

on:
  workflow_dispatch:
    inputs:
      release_python:
        description: "Release Python packages"
        required: false
        default: true
        type: boolean
      release_docker:
        description: "Release Docker images"
        required: false
        default: true
        type: boolean
      build_integrations:
        description: "Include allowlisted integration packages (see scripts/mmb-publish-integrations.conf)"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Perform a dry run (no actual building or pushing)"
        required: false
        default: false
        type: boolean
      force_release_version:
        description: "Require strict x.y.z release version (no suffixes)"
        required: false
        default: false
        type: boolean
      version_post:
        description: "PEP 440 post-release number for prefect (empty = none, e.g. 1 → .post1)"
        required: false
        default: ""
        type: string
      integration_version_post:
        description: "Post-release number for integrations (empty = none; independent of core)"
        required: false
        default: ""
        type: string
      base_version_override:
        description: "Override core base x.y.z from git (empty = auto from nearest upstream tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

# Prevent concurrent releases
concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release-python-packages:
    name: Release Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.release_python }}
    env:
      BUILD_INTEGRATIONS: ${{ inputs.build_integrations }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE_RELEASE_VERSION: ${{ inputs.force_release_version }}
      VERSION_POST: ${{ inputs.version_post }}
      INTEGRATION_VERSION_POST: ${{ inputs.integration_version_post }}
      BASE_VERSION_OVERRIDE: ${{ inputs.base_version_override }}
      ARTIFACT_REGISTRY_GCP_PROJECT: ${{ vars.ARTIFACT_REGISTRY_GCP_PROJECT }}
      ARTIFACT_REGISTRY_GCP_REGION: ${{ vars.ARTIFACT_REGISTRY_GCP_REGION }}
      ARTIFACT_REGISTRY_PYTHON_NAME: ${{ vars.ARTIFACT_REGISTRY_PYTHON_NAME }}
      ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}
      PREFECT_REPO_PAT: ${{ secrets.PREFECT_REPO_PAT }}
    permissions:
      contents: write
      id-token: write
    outputs:
      release_tags: ${{ steps.python_release.outputs.release_tags }}
      script_exit_code: ${{ steps.python_release.outputs.script_exit_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.PREFECT_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: 3.12

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Authenticate to Google Cloud (Workload Identity)
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.ARTIFACT_REGISTRY_GCP_PROJECT }}
          workload_identity_provider: ${{ env.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Run Python package release
        id: python_release
        run: |
          ./scripts/release-python-packages.sh \
            "$ARTIFACT_REGISTRY_GCP_PROJECT" \
            "$ARTIFACT_REGISTRY_GCP_REGION" \
            "$ARTIFACT_REGISTRY_PYTHON_NAME" \
            "$BUILD_INTEGRATIONS" \
            "$DRY_RUN" \
            "$FORCE_RELEASE_VERSION"

      - name: Create Python release summary
        if: always()
        env:
          SCRIPT_FAILED: ${{ steps.python_release.outputs.script_failed }}
          SCRIPT_EXIT_CODE: ${{ steps.python_release.outputs.script_exit_code }}
          PYTHON_RELEASE_OUTCOME: ${{ steps.python_release.outcome }}
          RELEASE_TAGS: ${{ steps.python_release.outputs.release_tags }}
        run: |
          echo "## 📦 Python Package Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Project ID: ${ARTIFACT_REGISTRY_GCP_PROJECT}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${ARTIFACT_REGISTRY_GCP_REGION}" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${ARTIFACT_REGISTRY_PYTHON_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Build integrations: ${BUILD_INTEGRATIONS}" >> $GITHUB_STEP_SUMMARY
          if [[ "${BUILD_INTEGRATIONS}" == "true" ]]; then
            echo "- MMB integration allowlist:" >> $GITHUB_STEP_SUMMARY
            grep -v '^[[:space:]]*#' scripts/mmb-publish-integrations.conf | grep -v '^[[:space:]]*$' | while read -r pkg; do
              echo "  - \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
            done
          fi
          echo "- Dry run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- Version post (core): ${VERSION_POST:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- Version post (integrations): ${INTEGRATION_VERSION_POST:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- Base version override: ${BASE_VERSION_OVERRIDE:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if the script failed and why
          if [[ "$SCRIPT_FAILED" == "true" ]]; then
            exit_code="$SCRIPT_EXIT_CODE"
            echo "⚠️ **Script completed with exit code: $exit_code**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            case $exit_code in
              1)
                echo "Some packages failed to upload. Check the logs above for details on which packages succeeded and which failed." >> $GITHUB_STEP_SUMMARY
                ;;
              2)
                echo "A configuration or setup error occurred." >> $GITHUB_STEP_SUMMARY
                ;;
              *)
                echo "An unexpected error occurred." >> $GITHUB_STEP_SUMMARY
                ;;
            esac
            echo "" >> $GITHUB_STEP_SUMMARY

            release_tags="$RELEASE_TAGS"
            if [[ -n "$release_tags" ]]; then
              echo "**Packages that were successfully uploaded (MMB tags will be created):**" >> $GITHUB_STEP_SUMMARY
              IFS=',' read -ra tags <<< "$release_tags"
              for tag in "${tags[@]}"; do
                echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
              done
            fi
          elif [[ "$PYTHON_RELEASE_OUTCOME" == "success" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "✅ **Dry run completed successfully**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No packages were actually built or uploaded." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Python packages released successfully**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Repository URL:**" >> $GITHUB_STEP_SUMMARY
              echo "https://console.cloud.google.com/artifacts/browse/${ARTIFACT_REGISTRY_GCP_PROJECT}/${ARTIFACT_REGISTRY_GCP_REGION}/${ARTIFACT_REGISTRY_PYTHON_NAME}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Installation:**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
              echo "pip install --index-url https://${ARTIFACT_REGISTRY_GCP_REGION}-python.pkg.dev/${ARTIFACT_REGISTRY_GCP_PROJECT}/${ARTIFACT_REGISTRY_PYTHON_NAME}/simple/ prefect" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

              release_tags="$RELEASE_TAGS"
              if [[ -n "$release_tags" ]]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**MMB release tags to be created:**" >> $GITHUB_STEP_SUMMARY
                IFS=',' read -ra tags <<< "$release_tags"
                for tag in "${tags[@]}"; do
                  echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
                done
              fi
            fi
          else
            echo "❌ **Python package release failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the job logs for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create MMB release tags
        if: >-
          !cancelled() &&
          env.DRY_RUN != 'true' &&
          steps.python_release.outputs.release_tags != ''
        env:
          RELEASE_TAGS: ${{ steps.python_release.outputs.release_tags }}
        run: ./scripts/create-mmb-release-tags.sh

  release-docker-images:
    name: Docker (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ inputs.release_docker }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE_RELEASE_VERSION: ${{ inputs.force_release_version }}
      VERSION_POST: ${{ inputs.version_post }}
      BASE_VERSION_OVERRIDE: ${{ inputs.base_version_override }}
      ARTIFACT_REGISTRY_GCP_PROJECT: ${{ vars.ARTIFACT_REGISTRY_GCP_PROJECT }}
      ARTIFACT_REGISTRY_GCP_REGION: ${{ vars.ARTIFACT_REGISTRY_GCP_REGION }}
      ARTIFACT_REGISTRY_DOCKER_NAME: ${{ vars.ARTIFACT_REGISTRY_DOCKER_NAME }}
      ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}
      DOCKER_REGISTRY: ${{ vars.ARTIFACT_REGISTRY_GCP_REGION }}-docker.pkg.dev/${{ vars.ARTIFACT_REGISTRY_GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_DOCKER_NAME }}
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud (Workload Identity)
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.ARTIFACT_REGISTRY_GCP_PROJECT }}
          workload_identity_provider: ${{ env.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Login to GCP Artifact Registry
        env:
          GCP_AUTH_TOKEN: ${{ steps.gcp_auth.outputs.auth_token }}
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v2.1.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ env.GCP_AUTH_TOKEN }}

      - name: Run Docker image release (no push)
        id: docker_release
        run: |
          ./scripts/release-docker-images.sh \
            "$ARTIFACT_REGISTRY_GCP_PROJECT" \
            "$ARTIFACT_REGISTRY_GCP_REGION" \
            "$ARTIFACT_REGISTRY_DOCKER_NAME" \
            "$DRY_RUN" \
            "true" \
            "$FORCE_RELEASE_VERSION" \
            "$PYTHON_VERSION"

      - name: Reauthenticate to Google Cloud (Workload Identity)
        id: gcp_auth_push
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ env.ARTIFACT_REGISTRY_GCP_PROJECT }}
          workload_identity_provider: ${{ env.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Login to GCP Artifact Registry
        env:
          GCP_AUTH_TOKEN: ${{ steps.gcp_auth_push.outputs.auth_token }}
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v2.1.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ env.GCP_AUTH_TOKEN }}

      - name: Run Docker image release (push)
        id: docker_release_push
        run: |
          ./scripts/release-docker-images.sh \
            "$ARTIFACT_REGISTRY_GCP_PROJECT" \
            "$ARTIFACT_REGISTRY_GCP_REGION" \
            "$ARTIFACT_REGISTRY_DOCKER_NAME" \
            "$DRY_RUN" \
            "false" \
            "$FORCE_RELEASE_VERSION" \
            "$PYTHON_VERSION"

      - name: Create Docker release summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🐳 Docker Image Release (Python ${PYTHON_VERSION})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Project ID: ${ARTIFACT_REGISTRY_GCP_PROJECT}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${ARTIFACT_REGISTRY_GCP_REGION}" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${ARTIFACT_REGISTRY_DOCKER_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Python version: ${PYTHON_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- Version post (core): ${VERSION_POST:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- Base version override: ${BASE_VERSION_OVERRIDE:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$JOB_STATUS" == "success" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "✅ **Dry run completed successfully**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No images were actually built or uploaded." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Docker images released successfully**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Repository URL:**" >> $GITHUB_STEP_SUMMARY
              echo "https://console.cloud.google.com/artifacts/browse/${ARTIFACT_REGISTRY_GCP_PROJECT}/${ARTIFACT_REGISTRY_GCP_REGION}/${ARTIFACT_REGISTRY_DOCKER_NAME}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
              echo "# Pull specific Python version built in this job:" >> $GITHUB_STEP_SUMMARY
              echo "docker pull ${ARTIFACT_REGISTRY_GCP_REGION}-docker.pkg.dev/${ARTIFACT_REGISTRY_GCP_PROJECT}/${ARTIFACT_REGISTRY_DOCKER_NAME}/prefect:latest-python${PYTHON_VERSION}" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Docker image release failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the job logs for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release-python-packages, release-docker-images]
    if: always()
    env:
      RELEASE_PYTHON: ${{ inputs.release_python }}
      RELEASE_DOCKER: ${{ inputs.release_docker }}
      BUILD_INTEGRATIONS: ${{ inputs.build_integrations }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERSION_POST: ${{ inputs.version_post }}
      INTEGRATION_VERSION_POST: ${{ inputs.integration_version_post }}
      BASE_VERSION_OVERRIDE: ${{ inputs.base_version_override }}
      ARTIFACT_REGISTRY_GCP_PROJECT: ${{ vars.ARTIFACT_REGISTRY_GCP_PROJECT }}
      ARTIFACT_REGISTRY_GCP_REGION: ${{ vars.ARTIFACT_REGISTRY_GCP_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create overall summary
        env:
          PYTHON_STATUS: ${{ needs.release-python-packages.result || 'skipped' }}
          DOCKER_STATUS: ${{ needs.release-docker-images.result || 'skipped' }}
        run: |
          echo "# 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- GCP Project: ${ARTIFACT_REGISTRY_GCP_PROJECT}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${ARTIFACT_REGISTRY_GCP_REGION}" >> $GITHUB_STEP_SUMMARY
          echo "- Python packages: ${RELEASE_PYTHON}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images: ${RELEASE_DOCKER}" >> $GITHUB_STEP_SUMMARY
          echo "- Build integrations: ${BUILD_INTEGRATIONS}" >> $GITHUB_STEP_SUMMARY
          if [[ "${BUILD_INTEGRATIONS}" == "true" ]]; then
            echo "- MMB integration allowlist:" >> $GITHUB_STEP_SUMMARY
            grep -v '^[[:space:]]*#' scripts/mmb-publish-integrations.conf | grep -v '^[[:space:]]*$' | while read -r pkg; do
              echo "  - \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
            done
          fi
          echo "- Dry run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- Version post (core): ${VERSION_POST:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- Version post (integrations): ${INTEGRATION_VERSION_POST:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- Base version override: ${BASE_VERSION_OVERRIDE:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check job statuses
          python_status="$PYTHON_STATUS"
          docker_status="$DOCKER_STATUS"

          echo "**Job Results:**" >> $GITHUB_STEP_SUMMARY

          if [[ "$RELEASE_PYTHON" == "true" ]]; then
            if [[ "$python_status" == "success" ]]; then
              echo "- ✅ Python packages: Success" >> $GITHUB_STEP_SUMMARY
            elif [[ "$python_status" == "failure" ]]; then
              echo "- ❌ Python packages: Failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⏸️ Python packages: $python_status" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Python packages: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$RELEASE_DOCKER" == "true" ]]; then
            if [[ "$docker_status" == "success" ]]; then
              echo "- ✅ Docker images: Success" >> $GITHUB_STEP_SUMMARY
            elif [[ "$docker_status" == "failure" ]]; then
              echo "- ❌ Docker images: Failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⏸️ Docker images: $docker_status" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Docker images: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [[ ("$RELEASE_PYTHON" != "true" || "$python_status" == "success") && ("$RELEASE_DOCKER" != "true" || "$docker_status" == "success") ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "🎉 **All dry runs completed successfully!**" >> $GITHUB_STEP_SUMMARY
            else
              echo "🎉 **All releases completed successfully!**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Access your artifacts:**" >> $GITHUB_STEP_SUMMARY
              echo "- [Artifact Registry Console](https://console.cloud.google.com/artifacts/browse/${ARTIFACT_REGISTRY_GCP_PROJECT})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ **Some releases failed. Check individual job logs for details.**" >> $GITHUB_STEP_SUMMARY
          fi
