name: MMB - Prepare Release

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Upstream tag to merge (e.g. 3.4.25)"
        required: true
        type: string
      dry_run:
        description: "Preview what would happen without making changes"
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PREFECT_REPO_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up upstream remote
        run: |
          if ! git remote | grep -q "^upstream$"; then
            git remote add upstream https://github.com/PrefectHQ/prefect.git
          fi

      - name: Dry run
        if: inputs.dry_run == true
        env:
          BASE_TAG: ${{ inputs.base_tag }}
        run: ./scripts/prepare-release-branch.sh --dry-run "$BASE_TAG"

      - name: Prepare release branch
        if: inputs.dry_run == false
        id: prepare
        env:
          BASE_TAG: ${{ inputs.base_tag }}
        run: ./scripts/prepare-release-branch.sh "$BASE_TAG"

      - name: Create pull request (clean merge)
        if: inputs.dry_run == false && steps.prepare.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_tag }}
          PREP_BRANCH: ${{ steps.prepare.outputs.prep_branch }}
        run: |
          cat > /tmp/pr-body.md << 'PREOF'
          ## Merge upstream UPSTREAM_TAG into release

          This PR was created automatically by the **MMB - Prepare Release** workflow.

          **Base tag:** \`UPSTREAM_TAG\`
          **Merge result:** Clean — no conflicts

          ### What this does
          Merges the upstream Prefect \`UPSTREAM_TAG\` tag into the \`release\`
          branch, bringing in all upstream changes while preserving MMB customisations.

          ### Review checklist
          - [ ] Confirm the diff looks correct (upstream changes + no unintended modifications)
          - [ ] Verify integration package code is at the expected version
          - [ ] Merge when satisfied — then run **MMB - Release Packages** to publish
          PREOF
          sed -i "s|UPSTREAM_TAG|${BASE_TAG}|g" /tmp/pr-body.md
          gh pr create \
            --base release \
            --head "$PREP_BRANCH" \
            --title "chore: merge upstream ${BASE_TAG} into release" \
            --body-file /tmp/pr-body.md

      - name: Create pull request (conflicts present)
        if: inputs.dry_run == false && steps.prepare.outputs.conflicts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_tag }}
          PREP_BRANCH: ${{ steps.prepare.outputs.prep_branch }}
        run: |
          cat > /tmp/pr-body.md << 'PREOF'
          ## Merge upstream UPSTREAM_TAG into release

          This PR was created automatically by the **MMB - Prepare Release** workflow.

          **Base tag:** \`UPSTREAM_TAG\`
          **Merge result:** ⚠️ Conflicts detected — resolution required before merging

          ### How to resolve conflicts

          1. Check out the prep branch locally:
             ```bash
             git fetch origin
             git checkout release-prep/UPSTREAM_TAG
             ```
          2. Open the files with conflict markers (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`),
             resolve each conflict, then stage and commit:
             ```bash
             git add <resolved-files>
             git commit --amend --no-edit   # or a new commit
             git push origin release-prep/UPSTREAM_TAG
             ```
          3. Once all conflicts are resolved and the PR is green, merge it.

          ### After merging
          Run **MMB - Release Packages** to build and publish Python packages and
          Docker images from the updated \`release\` branch.
          PREOF
          sed -i "s|UPSTREAM_TAG|${BASE_TAG}|g" /tmp/pr-body.md
          gh pr create \
            --base release \
            --head "$PREP_BRANCH" \
            --title "chore: merge upstream ${BASE_TAG} into release [CONFLICTS]" \
            --body-file /tmp/pr-body.md

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BASE_TAG: ${{ inputs.base_tag }}
          JOB_STATUS: ${{ job.status }}
          CONFLICTS: ${{ steps.prepare.outputs.conflicts }}
        run: |
          echo "## MMB - Prepare Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Base tag: \`${BASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **${JOB_STATUS}**" >> $GITHUB_STEP_SUMMARY
          if [[ "${DRY_RUN}" != "true" && "${JOB_STATUS}" == "success" ]]; then
            if [[ "${CONFLICTS}" == "true" ]]; then
              echo "- Merge result: ⚠️ **Conflicts — resolve in PR before merging**" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Merge result: ✅ Clean — PR is ready to review and merge" >> $GITHUB_STEP_SUMMARY
            fi
          fi
